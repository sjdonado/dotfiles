description: 'A fully bounded request goes straight to yolo in its own worktree: task branch in a sibling worktree, commits, push, one PR that adds an assertion and whose manual verification names the side-effect page.'
skills: ['yolo', 'worktree', 'open-pr']

setup:
  - 'git remote set-head origin main'

files:
  'AGENTS.md': |
    # Project

    Tiny TypeScript site run with Bun. Shared code lives in components/, pages in pages/.

    Local check: `bun check.ts`. It is the whole ladder: no typecheck, lint, build or remote CI.

    Git origin is a local bare repository. `gh` on PATH is a local forge substitute for pull requests; no real forge exists.

    This is a disposable evaluation repository: skip agent-review and subagent delegation, and run every step in this session.
  'components/label.ts': |
    // Shared display-name formatter.
    export function label(text: string): string {
      return text;
    }
  'pages/settings.ts': |
    import { label } from "../components/label.ts";

    export function renderSettings(name: string): string {
      return `<h1>Settings for ${label(name)}</h1>`;
    }
  'pages/home.ts': |
    import { label } from "../components/label.ts";

    export function renderHome(name: string): string {
      return `<h1>Welcome${label(name) ? `, ${label(name)}` : ""}</h1>`;
    }
  'check.ts': |
    import assert from "node:assert";
    import { renderHome } from "./pages/home.ts";
    import { renderSettings } from "./pages/settings.ts";

    assert.equal(renderSettings("Ada"), "<h1>Settings for Ada</h1>");
    assert.equal(renderHome("Ada"), "<h1>Welcome, Ada</h1>");
    console.log("check passed");

turns:
  - prompt: |-
      On the settings page, names should trim their ends and collapse inner runs of whitespace to one space, keeping casing. That is the whole scope. Acceptance: bun check.ts passes and renderSettings('  Ada \t Lovelace ') returns <h1>Settings for Ada Lovelace</h1>. Use the branch fix/settings-names. Ship it as a PR.
    expect:
      skills: ['yolo', 'worktree', 'open-pr']
      notSkills: ['iteration']
      ran: ['wt switch --create', 'bun check\.ts', 'git push']
      notRan:
        - 'git worktree add'
        - 'git (checkout -b|switch -c|branch [^-\s])'
      branch: '^main$'
      committed: false
      clean: true
      check:
        - 'git diff --quiet "$SEED"'
        - 'test "$(git rev-parse main)" = "$SEED"'
        - 'test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SEED"'
        - 'test ! -e .agent/main.md'
        - 'git rev-parse --verify -q refs/heads/fix/settings-names'
        - |-
          W="$(git worktree list --porcelain | awk '/^worktree /{p=substr($0,10)} /^branch refs\/heads\/main$/{next} /^branch /{print p}' | head -1)"; test -n "$W"; test "$W" != "$(git rev-parse --show-toplevel)" && test "$(dirname "$W")" = "$(dirname "$(git rev-parse --show-toplevel)")"
        - |-
          W="$(git worktree list --porcelain | awk '/^worktree /{p=substr($0,10)} /^branch refs\/heads\/main$/{next} /^branch /{print p}' | head -1)"; test -n "$W"; test "$(git -C "$W" branch --show-current)" = fix/settings-names && test -z "$(git -C "$W" status --porcelain)"
        - |-
          W="$(git worktree list --porcelain | awk '/^worktree /{p=substr($0,10)} /^branch refs\/heads\/main$/{next} /^branch /{print p}' | head -1)"; test -n "$W"; test "$(git -C "$W" rev-parse HEAD)" != "$SEED" && test "$(git ls-remote origin refs/heads/fix/settings-names | cut -f1)" = "$(git -C "$W" rev-parse HEAD)"
        - |-
          W="$(git worktree list --porcelain | awk '/^worktree /{p=substr($0,10)} /^branch refs\/heads\/main$/{next} /^branch /{print p}' | head -1)"; test -n "$W"; cd "$W" && git diff "$SEED" HEAD | grep -qE "^\+.*\b(assert|expect)\b"
        - |-
          W="$(git worktree list --porcelain | awk '/^worktree /{p=substr($0,10)} /^branch refs\/heads\/main$/{next} /^branch /{print p}' | head -1)"; test -n "$W"; cd "$W" && bun check.ts
        - |-
          W="$(git worktree list --porcelain | awk '/^worktree /{p=substr($0,10)} /^branch refs\/heads\/main$/{next} /^branch /{print p}' | head -1)"; test -n "$W"; cd "$W" && bun -e "import assert from 'node:assert'; import { renderSettings } from './pages/settings.ts'; assert.equal(renderSettings('  Ada \\t  Lovelace '), '<h1>Settings for Ada Lovelace</h1>')"
        - '! git log --all --format= --name-only | grep -q "^\.agent/"'
        - |-
          W="$(git worktree list --porcelain | awk '/^worktree /{p=substr($0,10)} /^branch refs\/heads\/main$/{next} /^branch /{print p}' | head -1)"; test -n "$W"; test -f "$W/.agent/fix%2Fsettings-names.tasks.md"
      reply: ['https://example\.invalid/pull/1']
      pr:
        title: ['^(?!wip:).+']
        body: ['manual verification[\s\S]*settings', 'manual verification[\s\S]*home']
