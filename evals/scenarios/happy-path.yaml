description: 'A clear task that asks for isolation gets a routine branch name without a confirmation loop, then user feedback reuses that branch without notes, review, or publication.'
skills: ['worktree']
core: true

setup:
  - 'git remote set-head origin main'

files:
  'AGENTS.md': |
    # Project

    Tiny TypeScript site run with Bun. Shared code lives in components/, pages in pages/.

    Local check: `bun check.ts`. It is the whole ladder: no typecheck, lint, build or remote CI.

    Git origin is a local bare repository. `gh` on PATH is a local forge substitute for pull requests; no real forge exists.

    This is a disposable evaluation repository.
  'components/label.ts': |
    // Shared display-name formatter.
    export function label(text: string): string {
      return text;
    }
  'pages/settings.ts': |
    import { label } from "../components/label.ts";

    export function renderSettings(name: string): string {
      return `<h1>Settings for ${label(name)}</h1>`;
    }
  'pages/home.ts': |
    import { label } from "../components/label.ts";

    export function renderHome(name: string): string {
      return `<h1>Welcome${label(name) ? `, ${label(name)}` : ""}</h1>`;
    }
  'check.ts': |
    import assert from "node:assert";
    import { renderHome } from "./pages/home.ts";
    import { renderSettings } from "./pages/settings.ts";

    assert.equal(renderSettings("Ada"), "<h1>Settings for Ada</h1>");
    assert.equal(renderHome("Ada"), "<h1>Welcome, Ada</h1>");
    console.log("check passed");

turns:
  - prompt: 'Names on the settings page look messy when people paste them with extra spaces, tabs or newlines. Clean them up but keep their casing, check the change, and work on an isolated task branch so I can review it afterward.'
    expect:
      branch: '^main$'
      committed: false
      clean: true
      check:
        - 'git diff --quiet "$SEED"'
        - 'test "$(git rev-parse main)" = "$SEED"'
        - 'test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SEED"'
        - 'test "$(git worktree list | wc -l)" -eq 2'
        - |-
          branches="$(git branch --format='%(refname:short)' | grep -v '^main$')"; test "$(printf '%s\n' "$branches" | wc -l | tr -d ' ')" -eq 1
        - |-
          W="$(git worktree list --porcelain | awk '/^worktree /{p=substr($0,10)} /^branch refs\/heads\/main$/{next} /^branch /{print p}' | head -1)"; test -n "$W"; test "$(git -C "$W" branch --show-current)" != main
        - |-
          W="$(git worktree list --porcelain | awk '/^worktree /{p=substr($0,10)} /^branch refs\/heads\/main$/{next} /^branch /{print p}' | head -1)"; test -n "$W"; cd "$W" && bun check.ts && bun -e "import assert from 'node:assert'; import { renderSettings } from './pages/settings.ts'; assert.equal(renderSettings(' Ada \\t\\n Lovelace '), '<h1>Settings for Ada Lovelace</h1>')"

      pr: false

  - prompt: 'I tried it and it looks right. Also make blank or whitespace-only names show Untitled.'
    expect:
      branch: '^main$'
      committed: false
      clean: true
      check:
        - 'git diff --quiet "$SEED"'
        - 'test "$(git worktree list | wc -l)" -eq 2'
        - |-
          branches="$(git branch --format='%(refname:short)' | grep -v '^main$')"; test "$(printf '%s\n' "$branches" | wc -l | tr -d ' ')" -eq 1
        - |-
          W="$(git worktree list --porcelain | awk '/^worktree /{p=substr($0,10)} /^branch refs\/heads\/main$/{next} /^branch /{print p}' | head -1)"; test -n "$W"; test "$(git -C "$W" status --porcelain | wc -l)" -gt 0
        - |-
          W="$(git worktree list --porcelain | awk '/^worktree /{p=substr($0,10)} /^branch refs\/heads\/main$/{next} /^branch /{print p}' | head -1)"; test -n "$W"; cd "$W" && bun check.ts && bun -e "import assert from 'node:assert'; import { renderSettings } from './pages/settings.ts'; assert.equal(renderSettings('   '), '<h1>Settings for Untitled</h1>'); assert.equal(renderSettings(' Ada  Lovelace '), '<h1>Settings for Ada Lovelace</h1>')"
      pr: false
