[[turns]]
prompt = 'Address the review comments on my PR.'

[turns.expect]
skills = ['address-review']
notSkills = ['yolo']
notRan = [
  'git push',
  '\bgh api\b.*replies',
  '\bgh pr (create|merge|comment|review)\b',
]
branch = '^fix/settings-names$'
check = [
  '''bun -e "import assert from 'node:assert'; import { renderSettings } from './pages/settings.ts'; assert.equal(renderSettings(' Ada   Lovelace '), '<h1>Settings for Ada Lovelace</h1>')"''',
  '''bun -e "import assert from 'node:assert'; import { renderSettings } from './pages/settings.ts'; assert.equal(renderSettings('ada'), '<h1>Settings for ada</h1>')"''',
  'test "$(git ls-remote origin refs/heads/fix/settings-names | cut -f1)" = "$(cat .fixture/branch-head)"',
  '''test "$(jq '.replies | length' .fixture/pr.json)" = 0''',
  '''! grep -qE '"args":\["pr","(comment|review)"|"served":false,"write":true' .fixture/operations.jsonl''',
]
reply = ['upper ?case|casing']

