description: 'Feedback on an open PR is applied locally on its branch, held until the user approves the batch, then pushed to the same PR with its description refreshed.'
skills: ['feedback']

setup:
  - 'git checkout -qb fix/settings-names'
  - |-
    printf '%s\n' '// Shared display-name formatter.' 'export function label(text: string): string {' '  return text.trim().replace(/\s+/g, " ");' '}' > components/label.ts
  - |-
    git commit -qam 'fix(settings): collapse whitespace in names'
  - 'git push -qu origin fix/settings-names'
  - 'git rev-parse HEAD > .fixture/branch-head'

files:
  'AGENTS.md': |
    # Project

    Tiny TypeScript site run with Bun. Shared code lives in components/, pages in pages/.

    Local check: `bun check.ts`. It is the whole ladder: no typecheck, lint, build or remote CI.

    Git origin is a local bare repository. `gh` on PATH is a local forge substitute for pull requests; no real forge exists.

    This is a disposable evaluation repository: skip agent-review and subagent delegation, and run every step in this session.
  'components/label.ts': |
    // Shared display-name formatter.
    export function label(text: string): string {
      return text;
    }
  'pages/settings.ts': |
    import { label } from "../components/label.ts";

    export function renderSettings(name: string): string {
      return `<h1>Settings for ${label(name)}</h1>`;
    }
  'pages/home.ts': |
    import { label } from "../components/label.ts";

    export function renderHome(name: string): string {
      return `<h1>Welcome${label(name) ? `, ${label(name)}` : ""}</h1>`;
    }
  'check.ts': |
    import assert from "node:assert";
    import { renderHome } from "./pages/home.ts";
    import { renderSettings } from "./pages/settings.ts";

    assert.equal(renderSettings("Ada"), "<h1>Settings for Ada</h1>");
    assert.equal(renderHome("Ada"), "<h1>Welcome, Ada</h1>");
    console.log("check passed");
  '.fixture/pr.json': |
    {
      "number": 1,
      "state": "OPEN",
      "url": "https://example.invalid/pull/1",
      "headRefName": "fix/settings-names",
      "baseRefName": "main",
      "isDraft": false,
      "mergeable": "MERGEABLE",
      "mergeStateStatus": "CLEAN",
      "mergedAt": null,
      "statusCheckRollup": [],
      "reviewThreads": [],
      "replies": [],
      "title": "fix(settings): collapse whitespace in names",
      "body": "Names on the settings page collapse runs of whitespace and keep their casing.\n\n## Manual verification\n\n- Settings page: a pasted name with tabs renders on one line.\n- Home page: uses the same label(); check the greeting.\n\nCloses #12\n"
    }
  '.agent/fix%2Fsettings-names.md': |
    # fix/settings-names

    ## Contract

    - **Purpose**: names on the settings page render without stray whitespace.
    - **End state**: `bun check.ts` passes and `renderSettings('  Ada   Lovelace ')` returns `<h1>Settings for Ada Lovelace</h1>`; PR https://example.invalid/pull/1 open.
    - **Key tasks**: .agent/fix%2Fsettings-names.tasks.md

    ## State

    - Branch fix/settings-names pushed; PR #1 open, awaiting review.

    ## Carry forward

    - Casing is kept as typed.
  '.agent/fix%2Fsettings-names.tasks.md': |
    # Tasks

    ## 1. Settings names

    - [x] 1.1 Collapse whitespace in label()
    - [x] 1.2 bun check.ts green
    - [x] 1.3 PR opened

turns:
  - prompt: |-
      Feedback on the PR:
      - The settings heading should read `Settings: <name>` instead of `Settings for <name>`.
      - Run the checks.
    expect:
      skills: ['feedback']
      notSkills: ['yolo']
      notRan:
        - 'git (commit|push)'
        - 'git (checkout -b|switch -c|branch [^-\s])'
        - '\bgh pr (create|merge|edit|comment|review)\b'
      branch: '^fix/settings-names$'
      committed: false
      clean: false
      check:
        - 'bun check.ts'
        - |-
          bun -e "import assert from 'node:assert'; import { renderSettings } from './pages/settings.ts'; assert.equal(renderSettings('  Ada  '), '<h1>Settings: Ada</h1>')"
        - |-
          bun -e "import assert from 'node:assert'; import { renderHome } from './pages/home.ts'; assert.equal(renderHome('Ada'), '<h1>Welcome, Ada</h1>')"
        - 'test "$(git ls-remote origin refs/heads/fix/settings-names | cut -f1)" = "$(cat .fixture/branch-head)"'
        - |-
          ! grep -qE '"args":\["pr","(comment|review)"|"served":false,"write":true' .fixture/operations.jsonl
      reply: ['\?']

  - prompt: 'Looks good. Publish this batch to the PR.'
    expect:
      notSkills: ['yolo']
      notRan:
        - 'git (checkout -b|switch -c|branch [^-\s])'
        - '\bgh pr (create|merge|comment|review)\b'
        - 'push.*(--force\b|-f\b)'
      branch: '^fix/settings-names$'
      committed: true
      clean: true
      pushed: true
      check:
        - |-
          grep -q '"args":\["pr","edit"' .fixture/operations.jsonl
        - 'bun check.ts'
        - |-
          bun -e "import assert from 'node:assert'; import { renderSettings } from './pages/settings.ts'; assert.equal(renderSettings('  Ada  '), '<h1>Settings: Ada</h1>')"
        - 'test "$(git rev-parse main)" = "$SEED"'
        - 'test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SEED"'
        - |-
          ! grep -qE '"args":\["pr","(comment|review)"|"served":false,"write":true' .fixture/operations.jsonl
      pr:
        title: ['^(?!wip:).+']
        body: ['Closes #12', 'Settings:']
        headRefName: ['^fix/settings-names$']
