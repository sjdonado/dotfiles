# Tool versions shared by macos.sh and linux.sh.
#
# These are the tools that were installed two different ways: a Homebrew formula
# on macOS and a hand-rolled `curl | sh` on Linux, each landing a different
# version with no record of which. One declaration replaces both, and mise.lock
# records what a machine actually resolved.
#
# Deliberately absent:
#
#   claude, codex, opencode   each self-updates into its own directory, so a
#                             pin here would fight its own updater.
#   herdr                     hosts every pane, including the one running the
#                             setup script. Swapping it out from under a live
#                             server is not worth the saved line.
#   moshi-hook                no public release, so no backend.
#
# Everything else stays with Homebrew on macOS and apt on Linux. Porting the
# whole Brewfile to [bootstrap.packages] is a separate change: mise reimplements
# Homebrew rather than wrapping it, and that wants testing on a Linux box first.

[settings]
lockfile = true

[tools]
"ubi:eugenioenko/ttt" = "latest"
"aqua:max-sixty/worktrunk" = "latest"
"aqua:astral-sh/uv" = "latest"
bun = "latest"
"npm:@fission-ai/openspec" = "latest"
