# Every link both verify scripts assert, minus what bootstrap cannot own:
# - ~/.config/mise/config.toml + mise.lock stay with the installers.
#   Self-managing the config mise is reading is a bootstrap footgun, and
#   linking has to work where mise is not installed yet (every first run).
# - ~/.local/bin/mise (the mise binary itself on Linux) and the stale-link
#   prune stay in lib/links.sh: symlink-each would link bin/ fine, but it
#   cannot distinguish "a script this repo removed" from a stranger's file.
# - ~/.fish_history, ~/.codex/config.toml, herdr plugins, `bat cache --build`,
#   `herdr integration install claude` ordering and `bin/codex-config apply`
#   are generated state or need a running server: a `[tasks.bootstrap]` each.
# - ~/.ssh/config links on macOS only (linux.sh never linked it), hence the
#   variant with no default: other platforms skip the entry.
[dotfiles]
"~/.gitconfig" = { source = "git/.gitconfig", mode = "symlink" }
"~/.config/fish/config.fish" = { source = "fish/config.fish", mode = "symlink" }
"~/.config/fish/functions" = { source = "fish/functions", mode = "symlink-each" }
"~/.config/ghostty/config" = { source = "ghostty/config", mode = "symlink" }
"~/.config/ghostty/themes" = { source = "ghostty/themes", mode = "symlink-each" }
"~/.config/bat/themes" = { source = "bat/themes", mode = "symlink-each" }
"~/.config/ttt/settings.json" = { source = "ttt/settings.json", mode = "symlink" }
"~/.config/herdr/config.toml" = { source = "herdr/config.toml", mode = "symlink" }
"~/.config/worktrunk/config.toml" = { source = "worktrunk/config.toml", mode = "symlink" }
"~/.docker/config.json" = { source = "docker/config.json", mode = "symlink" }
"~/.ssh/config" = { source = ".ssh/config", mode = "symlink", variants = [{ os = "macos" }] }
"~/.config/browser-router/config.json" = { source = "macos/browser-router.json", mode = "symlink", variants = [{ os = "macos" }] }
"~/.local/bin" = { source = "bin", mode = "symlink-each" }
"~/.claude/settings.json" = { source = "claude/settings.json", mode = "symlink" }
"~/.claude/skills" = { source = "agents/skills", mode = "symlink" }
"~/.claude/CLAUDE.md" = { source = "agents/AGENTS.md", mode = "symlink" }
"~/.agents/skills" = { source = "agents/skills", mode = "symlink" }
"~/.codex/AGENTS.md" = { source = "agents/AGENTS.md", mode = "symlink" }
"~/.config/opencode/opencode.json" = { source = "opencode/opencode.json", mode = "symlink" }
"~/.config/opencode/tui.json" = { source = "opencode/tui.json", mode = "symlink" }
"~/.config/opencode/AGENTS.md" = { source = "opencode/AGENTS.md", mode = "symlink" }
"~/.local/state/opencode/kv.json" = { source = "opencode/kv.json", mode = "symlink" }
# The shell-rc blocks linux.sh appends behind grep guards, as edit entries.
# Same content, same files; apply is idempotent by construction (markers), so
# the "second run doubles nothing" check becomes a property of the tool.
"~/.profile/tools-on-path" = { block = 'export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$HOME/.opencode/bin:$PATH"' }
"~/.zshenv/tools-on-path" = { block = 'export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$HOME/.opencode/bin:$PATH"' }
"~/.bashrc/tools-on-path" = { block = 'export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$HOME/.opencode/bin:$PATH"' }
"~/.zshrc/tools-on-path" = { block = 'export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$HOME/.opencode/bin:$PATH"' }
