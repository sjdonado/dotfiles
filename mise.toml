# Tools this setup installs, declared instead of scripted.
#
# Everything here used to be a `curl | sh` block or an apt package in linux.sh
# with a `have <cmd>` guard around it. mise makes the list the code: one install
# step provisions all of it, re-running updates it, and the shims directory is
# the only thing that has to be on PATH.
#
# Linked to ~/.config/mise/config.toml by the installers, so it is the global
# tool set for every project on the machine rather than a per-directory one.
# Both platforms read the same file: on macOS it replaced the Brewfile entries
# for the same tools, so a version bump happens in one place instead of two.
#
# What is deliberately NOT here, and why, so nobody tries again:
#   claude    the npm package is a wrapper that fetches a native binary from a
#             postinstall script; mise does not run those, so `claude --version`
#             fails with "claude native binary not installed".
#   opencode  the npm package has the same problem, but its GitHub release does
#             not: `github:anomalyco/opencode` installs a working binary, and
#             unlike the official installer it can authenticate, so it does not
#             fail on a box that has spent the hour's 60 anonymous API calls.
#   herdr     ships from its own CDN behind herdr.dev/latest.json, no GitHub release.
#   moshi-hook  same, cdn.getmoshi.app.
# Those four keep their official installers. fish and mosh stay with the system
# package manager: they are the login environment, not project tooling.
#
# Versions are pinned by mise.lock, which is tracked next to this file. It holds
# a URL and a sha256 per tool per platform, so two machines provisioned a month
# apart get the same tool set, and a locked resolve needs no GitHub API calls at
# all. That last part matters more than reproducibility here: the anonymous
# GitHub limit is 60 requests an hour per IP and was the one real flake in these
# installers. Refresh deliberately with `mise lock`, then commit the result.
#
# The installers link the lockfile to ~/.config/mise/mise.lock separately,
# because mise looks for it beside the config it resolved rather than in the
# repository the config is a link to. Miss that link and the lock is silently
# ignored.
#
# Rust is deliberately absent, and not because mise cannot do it. `rust@latest`
# installs cleanly and is rustup underneath: it drops rustup in ~/.cargo/bin and
# runs `rustup default`. The problem is the shim. Measured in a container: in a
# directory holding a rust-toolchain.toml pinning 1.90.0, mise's shim reports
# 1.98.1 and rustup's own proxy at ~/.cargo/bin/rustc starts syncing 1.90.0.
# Shims come first on PATH here by design, so letting mise own rust means a
# repository that pins a toolchain quietly builds with a different compiler.
# rustup stays the owner, from Homebrew on macOS; Linux boxes here install no
# rust at all because nothing on them needs cargo.


[tools]
# `lts` rather than `latest`: node@latest fails to resolve in mise.
node = "lts"
bun = "latest"
pnpm = "latest"
uv = "latest"

ripgrep = "latest"
fd = "latest"
bat = "latest"
fzf = "latest"
jq = "latest"

# The editor and the worktree tool, both straight from their GitHub releases.
# worktrunk's binary is named `wt`, which the backend cannot guess from the repo
# name. These two are the only entries that spend GitHub API calls, so a box
# behind a shared IP wants GITHUB_TOKEN set before provisioning.
"github:eugenioenko/ttt" = "latest"
"github:anomalyco/opencode" = "latest"
"github:max-sixty/worktrunk" = { version = "latest", exe = "wt" }

# `opencode upgrade` writes into mise's install directory rather than going
# through mise, so after a self-upgrade the version mise reports is stale until
# the next `mise install`. Harmless, but that is why it happens.

# npm-backed CLIs that work without a postinstall step.
"npm:@openai/codex" = "latest"
"npm:@fission-ai/openspec" = "latest"
