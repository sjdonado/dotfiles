# Ghostty's bundled "Apple System Colors", with the foreground slots that fail
# on this background raised to at least 4.5:1, the same floor the light file
# holds.
#
# Apple ships one palette for both variants and tunes it for dark, so most slots
# already pass here. Four did not: bright black #464646 at 1.77:1, which made
# any dimmed status text invisible rather than subdued, plus red 3.30:1, blue
# 3.09:1, magenta 3.14:1. Each replacement keeps
# Apple's hue and saturation and only raises lightness, landing just over the
# floor at 4.55:1 so the normal slots stay dimmer than their bright counterparts
# (bright red 4.89, bright blue 4.57, bright magenta 4.73). Bright black uses
# Apple's own #8e8e93 system gray, 5.11:1, still below white's 5.81:1.
#
# Yellow needs nothing: 7.54:1 normal, 11.81:1 bright.
#
# Recheck by comparing against "Apple System Colors" in Ghostty's resources;
# every deviation should be a lightness-only change.
palette = 0=#1a1a1a
palette = 1=#d95f58
palette = 2=#26a439
palette = 3=#cdac08
palette = 4=#1685f6
palette = 5=#ab6ccc
palette = 6=#479ec2
palette = 7=#98989d
palette = 8=#8e8e93
palette = 9=#ff453a
palette = 10=#32d74b
palette = 11=#ffd60a
palette = 12=#0a84ff
palette = 13=#bf5af2
palette = 14=#76d6ff
palette = 15=#ffffff
background = #1e1e1e
foreground = #ffffff
cursor-color = #98989d
cursor-text = #ffffff
selection-background = #3f638b
selection-foreground = #ffffff
