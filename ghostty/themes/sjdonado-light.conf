# Ghostty's bundled "Apple System Colors Light", with every foreground slot
# raised to at least 4.5:1 against the background.
#
# Apple ships one palette for both variants. The colours are tuned for the dark
# background and most of them fail on this one: bright green was 1.91:1, bright
# cyan 1.87:1, bright blue 3.64:1, yellow 2.21:1, where WCAG asks 4.5 for body
# text. Anything printing ANSI colour was hard or impossible to read in light
# mode, and the bright slots were the worst because "bright" means lighter,
# which is backwards over white.
#
# Each replacement holds Apple's hue and saturation and lowers lightness only,
# landing at about 5:1, so it reads as the same colour, just darker. Bright blue
# is at 5.20:1, matching yellow's 5.21:1: at the 4.54:1 it sat at before, it
# read as noticeably more vivid than every other slot in the same output line.
# 4.5 is the floor, not a preference; below it body text stops passing WCAG. Palette 15
# (white) is left at #ffffff on purpose: applications use it as a background,
# not as text. Background, foreground, cursor and selection are Apple's.
#
# Only slots 0-15 are overridden here, so a program emitting 256-cube or
# truecolor escapes bypasses this entirely and stays washed out. That is why
# ccstatusline runs at colorLevel 1: at 2 it emitted 38;5;111 for the session
# fields, a fixed light blue no palette can reach.
#
# Recheck by comparing against "Apple System Colors Light" in Ghostty's
# resources; every deviation should be a lightness-only change.
palette = 0=#1a1a1a
palette = 1=#cc372e
palette = 2=#1e802d
palette = 3=#806b05
palette = 4=#0869cb
palette = 5=#9647bf
palette = 6=#317793
palette = 7=#74747a
palette = 8=#464646
palette = 9=#df0c00
palette = 10=#198029
palette = 11=#856d00
palette = 12=#006ad6
palette = 13=#aa23ee
palette = 14=#0e77a3
palette = 15=#ffffff
background = #feffff
foreground = #000000
cursor-color = #98989d
cursor-text = #ffffff
selection-background = #abd8ff
selection-foreground = #000000
