gui:
  expandFocusedSidePanel: true
  mainPanelSplitMode: vertical
  showCommandLog: false
git:
  # Cycle with `|`. Side-by-side is the default, but an added or deleted file has
  # no content on one side, so it renders in half the width; flip to the inline
  # entry for those.
  # difftastic compares parse trees rather than lines: it wraps under its own
  # gutter and gives an added file the full width, because side-by-side collapses
  # to one column when there is no "before" content.
  #
  # --syntax-highlight=off leaves only the colours that describe the diff -- red,
  # green, underline for the changed span, dim for context -- all straight from the
  # terminal palette. difftastic's own highlighting maps each language's node types
  # onto one small palette, so the same colour means different things per language.
  # No --background either: nothing here has to know whether the terminal is light
  # or dark.
  #
  # No --width here. lazygit substitutes {{columnWidth}} for `pager` only, never
  # for externalDiffCommand, so the placeholder would arrive literally and difft
  # would exit with `invalid digit found in string`. Piped, difft defaults to 80
  # columns, which fits the panel; export DFT_WIDTH to override.
  diffRenderers:
    - command: difft --color=always --syntax-highlight=off --display=side-by-side
      type: extDiff
os:
  editPreset: nvim-remote
keybinding:
  universal:
    edit: [e, o]
    openFile: O
