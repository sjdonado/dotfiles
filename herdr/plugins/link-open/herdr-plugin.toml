# herdr-plugin.toml — manifest for the link-open plugin.
#
# Clicking a link in a pane dispatched it twice, about 0.6s apart. Finicky's log
# shows two inbound events for one click, both carrying the original URL, so the
# duplication happens before anything in the browser chain: every link opened two
# tabs, and while the handler was still an AppleScript applet the second launch
# landed on a live process and produced AppleScript's startup screen instead.
#
# A link handler claims the click, so herdr routes it here rather than opening it
# itself, and the URL reaches the system exactly once. Everything after that is
# Finicky's job: this deliberately does no matching or rewriting of its own.

id = "link-open"
name = "Link Open"
version = "1.0.0"
description = "Hand a clicked link to the system once, and let Finicky route it."
min_herdr_version = "0.7.0"
platforms = ["macos"]

[[actions]]
id = "open"
title = "Open link"
description = "Open the clicked link with the default handler."
contexts = ["pane"]
command = ["/bin/sh", "open-link.sh"]

[[link_handlers]]
id = "all"
title = "Open link"
pattern = "^https?://"
action = "open"
