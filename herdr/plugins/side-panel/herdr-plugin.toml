# herdr-plugin.toml — manifest for the side-panel plugin.
#
# Side panels that must never share a workspace: nvim for editing,
# herdr-lazygit for git. herdr has no notion of a mutually exclusive pane group,
# so this plugin owns the switch: open the requested panel, close the others
# first.
#
# nvim is a plain CLI, not a herdr plugin. switch.sh opens it with
# `herdr pane split --cwd <repo root>` rather than declaring [[panes]] here:
# plugin-owned panes start in the plugin root, which opened them on this repo
# instead of the worktree in front of you. lazygit belongs to herdr-lazygit, so
# that panel is delegated to its own `open` action.
#
# Bind these actions rather than herdr-lazygit.open directly (see
# herdr/config.toml).

id = "side-panel"
name = "Side Panel"
version = "0.4.0"
description = "Mutually exclusive side panels: nvim and lazygit. Opening one closes the other."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

[[actions]]
id = "edit"
title = "Side panel: nvim"
description = "Toggle the nvim panel, closing the other side panels first."
contexts = ["pane", "workspace"]
command = ["bash", "scripts/switch.sh", "edit"]

[[actions]]
id = "lazygit"
title = "Side panel: lazygit"
description = "Toggle the lazygit panel, closing the other side panels first."
contexts = ["pane", "workspace"]
command = ["bash", "scripts/switch.sh", "lazygit"]
