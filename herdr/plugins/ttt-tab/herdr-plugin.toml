# herdr-plugin.toml — manifest for the ttt-tab plugin.
#
# Upstream ships its own herdr plugin (github.com/eugenioenko/ttt/tree/main/herdr-plugin,
# id ttt.editor) and it is not used here for two reasons. It opens TTT but cannot
# route right-clicks to it, which is the thing that makes TTT usable with a
# pointer: herdr's own context menu otherwise swallows every right-click, and the
# per-pane "Send right-clicks to pane" toggle has to be picked by hand for every
# new TTT pane. And its open action is open-only, where the key here is a toggle
# that returns you to the tab you came from.
#
# Right-click routing is not declarable: the plugin pane manifest has no field for
# it (id, title, command, placement, width, height, description, platforms), and
# `herdr plugin pane open` has no flag. It is pane state set after the fact with
# `herdr pane input --right-click pane`, which is what scripts/toggle.sh does on
# the pane it just opened.

id = "ttt-tab"
name = "TTT Tab"
version = "1.0.0"
description = "Toggle a dedicated TTT tab with right-clicks routed to the editor."
# 0.8.2 is the first stable release with per-pane right-click routing; it landed
# in the 2026-08-17 preview. Below that the toggle would open TTT and silently
# leave right-clicks on herdr's menu.
min_herdr_version = "0.8.2"
platforms = ["linux", "macos"]

# TTT is declared as a plugin pane rather than started with `pane run` in a freshly
# created tab: `pane run` writes into the pty, which races the shell's own startup,
# and fish discarded the line as it initialized. An entrypoint is spawned by herdr
# as the pane's own process, so there is no shell and nothing to race. herdr runs it
# with cwd set to the launcher's --cwd, so the tab opens on the repo.
[[panes]]
id = "ttt"
title = "ttt"
placement = "tab"
command = ["ttt"]

[[actions]]
id = "toggle"
title = "Toggle the TTT tab"
description = "Focus the TTT tab, creating it when absent; return to the previous tab when it already has focus."
contexts = ["pane", "workspace"]
command = ["bash", "scripts/toggle.sh"]
