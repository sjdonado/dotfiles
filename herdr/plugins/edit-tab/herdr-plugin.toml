# herdr-plugin.toml — manifest for the edit-tab plugin.
#
# nvim opens as an overlay pane rather than in its own tab. An overlay takes its
# visible title from the `title` below, where a tab placement makes herdr name the
# tab by its running number and needs a rename afterwards, and it is addressable
# by pane id, so the toggle is open or close. This is the shape herdr's own
# annotate plugin uses.
#
# The toggle still needs a script because herdr has no create-or-close primitive:
# remembering which pane it opened happens outside herdr.

id = "edit-tab"
name = "Edit Tab"
version = "1.2.0"
description = "Toggle the nvim and git-bug termui overlay panes: open one, or close it again."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

# nvim is declared as a plugin pane rather than started with `pane run` in a
# freshly created tab: `pane run` writes into the pty, which races the shell's own
# startup, and fish discarded the line as it initialized, leaving `exec nvim`
# echoed above a bare prompt. An entrypoint is spawned by herdr as the pane's own
# process, so there is no shell and nothing to race. herdr runs it with cwd set to
# the launcher's --cwd, not the plugin root, so the overlay opens on the repo.
[[panes]]
id = "nvim"
title = "nvim"
placement = "overlay"
command = ["nvim"]

# git-bug's termui, toggled the same way. termui holds git-bug's repository lock while
# it runs, so closing the overlay is also what frees git-bug for the CLI and the MCP.
[[panes]]
id = "git-bug"
title = "git-bug"
placement = "overlay"
# Plugin panes run with cwd set to the repo, so the guard script is found by plugin root.
command = ["sh", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/scripts/git-bug-tui.sh\""]

[[actions]]
id = "toggle"
title = "Toggle the nvim pane"
description = "Open the nvim overlay over the active pane, or close it when it is already open."
contexts = ["pane", "workspace"]
command = ["bash", "scripts/toggle.sh"]

[[actions]]
id = "toggle-bug"
title = "Toggle the git-bug termui pane"
description = "Open git-bug's termui as an overlay over the active pane, or close it when it is already open."
contexts = ["pane", "workspace"]
command = ["bash", "scripts/toggle.sh", "git-bug"]
