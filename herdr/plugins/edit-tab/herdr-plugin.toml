# herdr-plugin.toml — manifest for the edit-tab plugin.
#
# nvim opens as an overlay pane rather than in its own tab. An overlay takes its
# visible title from the `title` below, where a tab placement makes herdr name the
# tab by its running number and needs a rename afterwards, and it is addressable
# by pane id, so the toggle is just open-or-focus. This is the shape herdr's own
# annotate plugin uses.
#
# The toggle still needs a script because herdr has no create-or-focus primitive:
# finding the existing pane happens outside herdr.

id = "edit-tab"
name = "Edit Tab"
version = "1.1.0"
description = "Toggle the nvim overlay pane: open it, or close it again."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

# nvim is declared as a plugin pane rather than started with `pane run` in a
# freshly created tab: `pane run` writes into the pty, which races the shell's own
# startup, and fish discarded the line as it initialized, leaving `exec nvim`
# echoed above a bare prompt. An entrypoint is spawned by herdr as the pane's own
# process, so there is no shell and nothing to race. herdr runs it with cwd set to
# the launcher's --cwd, not the plugin root, so the tab opens on the repo.
[[panes]]
id = "nvim"
title = "nvim"
placement = "overlay"
command = ["nvim"]

[[actions]]
id = "toggle"
title = "Toggle the nvim pane"
description = "Open the nvim overlay over the active pane, or close it when it is already open."
contexts = ["pane", "workspace"]
command = ["bash", "scripts/toggle.sh"]
