onboarding = false

[ui]
show_agent_labels_on_pane_borders = false
# Attention queue: sort agents by status so blocked and idle streams surface
# first. With many parallel streams, grouping by space buries the ones that
# need a human.
agent_panel_sort = "spaces"
mouse_capture = true
# Window title without herdr's default {hostname} prefix: the hostname is
# DHCP-derived (the router hands out a domain, so it reads "Mac.vodafone.ultrahub"
# and changes with the network), and every pane runs locally anyway. The workspace
# name is the part worth reading in the macOS titlebar and the app switcher.
window_title = "{workspace}"
copy_on_select = false

[ui.toast]
delivery = "terminal"

# Catppuccin, deliberately not matching ghostty's Terminal Basic pair.
#
# "terminal" is the theme that would match, since it builds herdr's UI from the
# host's ANSI palette. It is unusable on a light palette: a correct light theme
# still keeps a dark slot 0, so programs printing "black" stay readable on
# white, and herdr paints its panels from that slot — dark chrome under a light
# terminal, with the selected row landing on bright black under the accent at
# 1.58:1. https://github.com/herdrdev/herdr/issues/1731, open, no fix. It also
# reproduces on dark palettes, contrary to what that issue says.
#
# [theme.custom] does compose with it, but only exposes the two ends of that
# pair (accent, subtext0) and not the selected-row foreground itself, so no
# override reaches the actual defect.
#
# Catppuccin is the nearest thing that renders correctly in both modes, and is
# what the issue reporter settled on too. It costs palette tracking: a ghostty
# theme change no longer carries over. Switch back to name = "terminal" once
# 1731 lands.
[theme]
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[terminal]
default_shell = "fish"

# Worktree keys are herdr's built-in dialogs (prefix+shift+g to create; remove
# lives in the command palette, unbound by default) rather than the worktrunk
# plugin's picker: the picker existed to spawn an agent in the new worktree, and
# that is not wanted. The dialogs create the checkout directly, so nothing in
# worktrunk/config.toml runs — no copy-ignored pre-start. The local copy-ignored
# plugin covers that instead: it subscribes to herdr's worktree.created event and
# runs `wt step copy-ignored` in the fresh checkout, which is the only part of
# the worktrunk hooks the keyboard path needed.
[keys]
settings = "prefix+,"

# lazygit-panel rather than herdr-lazygit.open directly: same toggle, but it first
# repairs the pane a server restart left as a bare shell. Upstream's launcher
# treats such a pane as somebody else's and opens a second sidebar beside it.
[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "lazygit-panel.toggle"

[[keys.command]]
key = "prefix+."
type = "plugin_action"
command = "edit-tab.toggle"

[experimental]
# Render inline agent images via Kitty graphics; ghostty supports it.
# Without this, panes show a black gap where the image would be.
kitty_graphics = true
