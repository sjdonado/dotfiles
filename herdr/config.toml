onboarding = false

[ui]
show_agent_labels_on_pane_borders = false
# Attention queue: sort agents by status so blocked and idle streams surface
# first. With many parallel streams, grouping by space buries the ones that
# need a human.
agent_panel_sort = "spaces"
mouse_capture = true
copy_on_select = true

[ui.toast]
delivery = "terminal"

[theme]
auto_switch = true
dark_name = "one-dark"
light_name = "one-light"

[terminal]
default_shell = "fish"

[keys]
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+shift+x"

# Side panels, via the local side-panel plugin so only one is ever open: it
# closes the other before toggling the requested one. Bind the wrappers, not
# persiyanov.reviewr.toggle / herdr-lazygit.open directly.
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "side-panel.diff"

[[keys.command]]
key = "prefix+l"
type = "plugin_action"
command = "side-panel.lazygit"

[experimental]
# Render inline agent images via Kitty graphics; ghostty supports it.
# Without this, panes show a black gap where the image would be.
kitty_graphics = true
