onboarding = false

[ui]
show_agent_labels_on_pane_borders = false
# Attention queue: sort agents by status so blocked and idle streams surface
# first. With many parallel streams, grouping by space buries the ones that
# need a human.
agent_panel_sort = "spaces"
mouse_capture = true
# Window title without herdr's default {hostname} prefix: the hostname is
# DHCP-derived (the router hands out a domain, so it reads "Mac.vodafone.ultrahub"
# and changes with the network), and every pane runs locally anyway. The workspace
# name is the part worth reading in the macOS titlebar and the app switcher.
window_title = "{workspace}"
copy_on_select = false

[ui.toast]
delivery = "terminal"

# Catppuccin, deliberately not matching ghostty's Terminal Basic pair.
#
# "terminal" is the theme that would match, since it builds herdr's UI from the
# host's ANSI palette. It is unusable on a light palette: a correct light theme
# still keeps a dark slot 0, so programs printing "black" stay readable on
# white, and herdr paints its panels from that slot — dark chrome under a light
# terminal, with the selected row landing on bright black under the accent at
# 1.58:1. https://github.com/herdrdev/herdr/issues/1731, open, no fix. It also
# reproduces on dark palettes, contrary to what that issue says.
#
# [theme.custom] does compose with it, but only exposes the two ends of that
# pair (accent, subtext0) and not the selected-row foreground itself, so no
# override reaches the actual defect.
#
# Catppuccin is the nearest thing that renders correctly in both modes, and is
# what the issue reporter settled on too. It costs palette tracking: a ghostty
# theme change no longer carries over. Switch back to name = "terminal" once
# 1731 lands.
[theme]
auto_switch = false
dark_name = "catppuccin"
light_name = "catppuccin-latte"

name = "catppuccin"
[terminal]
default_shell = "fish"

# Worktree keys are herdr's built-in dialogs (prefix+shift+g to create; remove
# lives in the command palette, unbound by default) rather than the worktrunk
# plugin's picker: the picker existed to spawn an agent in the new worktree, and
# that is not wanted. The dialogs create the checkout directly, so nothing in
# worktrunk/config.toml runs — no copy-ignored pre-start. The local copy-ignored
# plugin covers that instead: it subscribes to herdr's worktree.created event and
# runs `wt step copy-ignored` in the fresh checkout, which is the only part of
# the worktrunk hooks the keyboard path needed.
[keys]
settings = "prefix+,"
# The nvim tab toggle below takes prefix+e, which is also edit_scrollback's
# default, so scrollback opens one modifier further in rather than losing the key.
edit_scrollback = "prefix+shift+e"

# Direct chord, no prefix: workspaces are what gets switched between all day, and
# the sidebar already numbers them. Bound to ctrl+alt rather than cmd because a
# super-modified digit only transmits when the outer terminal and the client have
# negotiated the Kitty keyboard protocol, while ctrl+alt is the family herdr
# documents as safe. ghostty/config maps cmd+1..9 onto exactly these sequences,
# so the chord the fingers press is cmd, and the chord on the wire is ctrl+alt.
switch_workspace = "ctrl+alt+1..9"

# edit-tab rather than herdr's built-in editor keymap: the toggle opens an overlay
# over the active pane and closes it again, which herdr has no primitive for.
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "edit-tab.toggle"

# Agent Usage is on demand, not in the sidebar: the always-on quota rows made
# each agent entry too tall for the Agents panel to keep the focused agent
# visible. `prefix+u` opens the plugin's native limits pane; `ctrl+shift+m`
# refreshes the data (Control+Shift on Mac, not Command).
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "Agent Usage: open usage pane"

[[keys.command]]
key = "ctrl+shift+m"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh usage data"

[experimental]
# Render inline agent images via Kitty graphics; ghostty supports it.
# Without this, panes show a black gap where the image would be.
kitty_graphics = true

# Herdr Annotate (plannotator/herdr-annotate): comment on terminal selections and
# on documents or agent replies, then send the annotations back to the agent. It
# ships no setup action, so these are its documented keys, written by hand.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"
