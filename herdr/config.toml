onboarding = false

[ui]
show_agent_labels_on_pane_borders = false
# Attention queue: sort agents by status so blocked and idle streams surface
# first. With many parallel streams, grouping by space buries the ones that
# need a human.
agent_panel_sort = "spaces"
mouse_capture = true
copy_on_select = true

[ui.toast]
delivery = "terminal"

[theme]
auto_switch = true
dark_name = "one-dark"
light_name = "one-light"

[terminal]
default_shell = "fish"

[keys]
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+shift+x"
settings = "prefix+,"

# lazygit is the only side panel, so herdr-lazygit's own toggle is enough; nvim
# moved to a tab of its own and no longer competes for the panel.
[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "herdr-lazygit.open"

[[keys.command]]
key = "prefix+."
type = "plugin_action"
command = "edit-tab.toggle"

# worktree-agent rather than worktrunk directly: it opens the same picker, but
# passes the focused pane's agent kind down so the new worktree comes up with
# that agent running instead of a bare shell.
#
# Default branch is the base that matters for the common case (start work from
# main); creating off the current branch is rarer and stays in the command
# palette as worktree-agent.open-current rather than burning a chord.
[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "worktree-agent.open"

[[keys.command]]
key = "prefix+shift+x"
type = "plugin_action"
command = "worktrunk.remove"

[experimental]
# Render inline agent images via Kitty graphics; ghostty supports it.
# Without this, panes show a black gap where the image would be.
kitty_graphics = true
